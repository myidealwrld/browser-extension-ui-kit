<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Background job demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">MV3 SIDE PANEL</p><h1>Background job</h1></header>
    <section class="job" aria-live="polite">
      <div class="job-head"><h2 id="job-title">No job started</h2><span id="job-status">Ready</span></div>
      <progress id="progress" max="25" value="0"></progress>
      <p id="progress-label">0 of 25 items complete</p>
      <button id="start" type="button">Process 25 demo items</button>
      <ul id="items" aria-label="Demo item progress"></ul>
    </section>
    <p class="footer">The job state is saved locally and continues independently of this panel and tab.</p>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
